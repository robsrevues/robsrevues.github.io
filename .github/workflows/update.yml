name: Update and deploy

on:
  schedule:
    - cron: "17 11 * * *"   # every day around 6:17 AM Central (11:17 UTC)
  push:
    branches: [main]
  workflow_dispatch:         # "Run workflow" button for an on-demand refresh

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull latest videos and stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: node scripts/fetch.mjs

      - name: Save stats history
        run: |
          git config user.name "robsrevues-bot"
          git config user.email "robsrevues-bot@users.noreply.github.com"
          git add data public
          git diff --cached --quiet || git commit -m "Update stats $(date -u +%F)"
          git push || echo "Nothing to push"

      - name: Build site
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
